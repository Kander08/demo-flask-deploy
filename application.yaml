apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-flask-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kander08/demo-flask-deploy.git
    targetRevision: master
    path: demo-flask
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true